[package]
name = "zerc20-indexer"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[lints]
workspace = true

[dependencies]
alloy = { version = "=2.5.0", features = ["provider-http", "rpc-types", "reqwest"] }
anyhow = "=1.0.104"
axum = "=0.8.9"
fastrand = "=2.5.0"
futures = "=0.3.34"
parking_lot = "=0.12.5"
regex = "=1.13.1"
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "=1.53.3", features = ["full"] }
tracing = "=0.1.44"
tower-http = { version = "=0.6.11", features = ["compression-gzip", "compression-br"] }
zerc20-common = { path = "../common" }
zerc20-zkp = { path = "../../zkp" }

[dev-dependencies]
reqwest = { version = "=0.13.5", features = ["json"] }
