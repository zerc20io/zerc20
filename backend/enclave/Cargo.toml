[package]
name = "zerc20-enclave"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[lints]
workspace = true

[features]
# What runs inside a Nitro Enclave. A feature keeps vendored OpenSSL out of every other build.
nitro = ["dep:aws-nitro-enclaves-nsm-api", "dep:openssl", "dep:serde_bytes"]

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["full"] }
vsock = "=0.5.4"

aws-nitro-enclaves-nsm-api = { version = "=0.5.2", optional = true }
openssl = { version = "=0.10.81", features = ["vendored"], optional = true }
serde_bytes = { version = "=0.11.19", optional = true }
