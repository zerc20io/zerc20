[package]
name = "zerc20-attester-proto"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lints]
workspace = true

[features]
# Valid statements and witnesses, for other crates' tests.
fixtures = []
# Checking a Nitro attestation document before sealing to the key in it: wallets.
nitro = ["dep:ciborium", "dep:p384", "dep:sha2", "dep:x509-cert"]

[dependencies]
alloy-primitives = { version = "=1.7.3", features = ["serde"] }
alloy-sol-types = "=1.7.3"
anyhow = "=1.0.104"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zerc20-zkp = { path = "../../../zkp", default-features = false }

ciborium = { version = "=0.2.2", optional = true }
p384 = { version = "=0.13.1", features = ["ecdsa", "pkcs8"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
x509-cert = { version = "=0.2.5", optional = true }

[dev-dependencies]
sha2 = { version = "=0.10.9", features = ["oid"] }
x509-cert = { version = "=0.2.5", features = ["builder"] }
