[package]
name = "zerc20-attester"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[lints]
workspace = true

[features]
# The Nitro Enclave's binary. A feature keeps vendored OpenSSL out of every other build.
enclave = ["zerc20-enclave/nitro", "dep:openssl"]

[[bin]]
name = "enclave"
required-features = ["enclave"]

[dependencies]
alloy = { version = "=2.5.0", features = ["provider-http", "rpc-types", "reqwest", "contract", "signer-local"] }
anyhow = "=1.0.104"
axum = "=0.8.9"
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["full"] }
tracing = "=0.1.44"
zerc20-attester-proto = { path = "proto" }
zerc20-common = { path = "../common" }
zerc20-enclave = { path = "../enclave" }
zerc20-zkp = { path = "../../zkp" }

openssl = { version = "=0.10.81", features = ["vendored"], optional = true }

[dev-dependencies]
zerc20-attester-proto = { path = "proto", features = ["fixtures"] }
