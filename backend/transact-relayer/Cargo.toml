[package]
name = "zerc20-transact-relayer"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[lints]
workspace = true

[dependencies]
alloy = { version = "=2.5.0", features = ["provider-http", "rpc-types", "reqwest", "contract"] }
anyhow = "=1.0.104"
axum = "=0.8.9"
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["full"] }
tracing = "=0.1.44"
zerc20-common = { path = "../common" }
zerc20-zkp = { path = "../../zkp" }

[dev-dependencies]
tracing-subscriber = "=0.3.23"
