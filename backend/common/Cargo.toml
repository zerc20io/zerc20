[package]
name = "zerc20-common"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[lints]
workspace = true

[dependencies]
alloy = { version = "=2.5.0", features = ["provider-http", "rpc-types", "reqwest", "signer-local"] }
anyhow = "=1.0.104"
axum = "=0.8.9"
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["full"] }
tower-http = { version = "=0.6.11", features = ["cors"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
zerc20-zkp = { path = "../../zkp" }
