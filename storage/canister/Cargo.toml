[package]
name = "zerc20_storage"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10.38"
ic-cdk = "0.18.7"
ic-stable-structures = "0.7.2"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
